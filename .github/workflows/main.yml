name: Tender Monitor

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SAM_API_KEY: ${{ secrets.SAM_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests beautifulsoup4

      - run: python sam_test.py

      - run: python panama_test.py
